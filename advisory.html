<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Advisory | AgriSmart</title>

  <link rel="stylesheet" href="body.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>

<div class="container">

  <aside class="sidebar">
    <h2 class="logo">
      <img class="logo-img" src="images/leaf logo.webp">
      AgriSmart
    </h2>

    <nav class="menu">
      <a onclick="showPage('dashboard')">Dashboard</a>
      <a class="active">AI Advisory</a>
      <a onclick="showPage('history')">Request History</a>
      <a onclick="showPage('dataset')">Crop Database</a>
    </nav>

    <div class="status">
      <span class="dot"></span>
      <div>
        <strong>System Online</strong>
        <p>Advisory ready</p>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <h1>🌱 AI Advisory System</h1>
    <p>Enter soil and environmental parameters to get crop recommendations.</p>

    <hr>

    <h2>Soil & Environment Inputs</h2>

    <form>
      <label>Temperature (°C)</label><br>
      <input type="number"><br><br>

      <label>Humidity (%)</label><br>
      <input type="number"><br><br>

      <label>Nitrogen</label><br>
      <input type="number"><br><br>

      <label>Phosphorous</label><br>
      <input type="number"><br><br>

      <label>Potassium</label><br>
      <input type="number"><br><br>

      <label>pH Level</label><br>
      <input type="number" step="0.1"><br><br>

      <label>Sunlight</label><br>
      <input type="number"><br><br>

      <button type="button">Predict Crop</button>
    </form>

    <hr>

    <h2>Prediction Result</h2>
    <table border="1">
      <tr><th>Recommended Crop</th><td>---</td></tr>
      <tr><th>Confidence</th><td>---</td></tr>
      <tr><th>Notes</th><td>---</td></tr>
    </table>

  </main>
</div>

</body>
</html>
